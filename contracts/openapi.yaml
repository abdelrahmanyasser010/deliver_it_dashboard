openapi: 3.1.0
info:
  title: FIX 365 Unified API — Production Contract
  version: 1.3.0
  description: عقد API الإنتاجي الموحد لمنصة FIX 365 — فيكس 365. هذا الملف هو المصدر التنفيذي للمسارات والـSchemas ويجب تحديثه واختباره قبل أي تغيير متوافق مع العملاء.
servers:
- url: https://{tenant}.api.example.com
  variables:
    tenant:
      default: demo
tags:
- name: Auth
- name: Merchant Applications
- name: Dashboard
- name: Branches
- name: Zones
- name: Merchants
- name: Pricing
- name: Drivers
- name: Shipments
- name: Delivery
- name: Public Tracking
- name: Pickup
- name: Intake
- name: Dispatch
- name: Merchant Mobile
- name: Driver Mobile
- name: Exceptions
- name: Finance
- name: Settlements
- name: Accounting
- name: Reports
- name: Messaging
- name: Notifications
- name: Devices
- name: Files
- name: Audit
- name: Access
- name: Returns
- name: Settings
- name: Driver Updates
- name: Preferences
- name: Labels
- name: Vehicles
  description: إدارة المركبات
- name: Driver Shifts
  description: ورديات المندوب
- name: Cash Collections
  description: تحصيلات COD
- name: Health
  description: الصحة والجاهزية
- name: Pricing Profiles
  description: ملفات التسعير
paths:
  /api/v1/auth/login:
    post:
      summary: تسجيل دخول موحد
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - request_id
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: '#/components/schemas/AuthTokenResponse'
                  request_id:
                    type: string
        '400': &id001
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401': &id002
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403': &id003
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409': &id004
          description: Business conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422': &id005
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      operationId: post_api_v1_auth_login
  /api/v1/auth/logout:
    post:
      summary: إلغاء Token الجهاز
      tags:
      - Auth
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                - request_id
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    type: object
                    additionalProperties: true
                  request_id:
                    type: string
        '400': *id001
        '401': *id002
        '403': *id003
        '409': *id004
        '422': *id005
      security:
      - sanctum: []
      operationId: post_api_v1_auth_logout
  /api/v1/me:
    get:
      summary: سياق المستخدم والعضوية الحالية
