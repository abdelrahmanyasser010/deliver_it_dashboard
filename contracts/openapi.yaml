components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Token
  schemas:
    EnvelopeMeta:
      type: object
      properties:
        request_id:
          type: string
        server_time:
          type: string
          format: date-time
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    ErrorEnvelope:
      type: object
      required:
      - success
      - error
      - request_id
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/Error'
        request_id:
          type: string
    UserContext:
      type: object
      required:
      - id
      - name
      - role
      - tenant
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        tenant:
          $ref: '#/components/schemas/TenantSummary'
        merchant_id:
          type:
          - string
          - 'null'
        driver_id:
          type:
          - string
          - 'null'
    TenantSummary:
      type: object
      required:
      - id
      - name
      - slug
      - timezone
      - currency
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        timezone:
          type: string
        currency:
          type: string
    LoginRequest:
      type: object
      required:
      - identifier
      - password
      properties:
        identifier:
          type: string
        password:
          type: string
          format: password
          maxLength: 128
        device_id:
          type: string
        device_name:
          type: string
        push_token:
          type: string
    AuthTokenResponse:
      type: object
      required:
      - token
      - user
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserContext'
    Address:
      type: object
      required:
      - governorate
      - city
      - address_line
      properties:
        governorate:
          type: string
        city:
          type: string
        zone_id:
          type:
          - string
          - 'null'
        address_line:
          type: string
        landmark:
          type:
          - string
          - 'null'
        latitude:
          type:
          - number
          - 'null'
          format: double
        longitude:
          type:
          - number
          - 'null'
          format: double
    MerchantMobileDashboard:
      type: object
      additionalProperties: false
      required:
      - shipment_counts
      - settled_or_payable_minor
      - currency
      properties:
        shipment_counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        settled_or_payable_minor:
          type: integer
        currency:
          type: string
    MerchantFinancialSummary:
      type: object
      additionalProperties: false
      required:
      - expected_collection_minor
      - collected_minor
      - remitted_minor
      - payable_minor
      - paid_minor
      - delivery_fees_minor
      - return_fees_minor
      - extra_attempt_fees_minor
      - collection_fees_minor
      - tax_minor
      - currency
      properties:
        expected_collection_minor:
          type: integer
        collected_minor:
          type: integer
        remitted_minor:
          type: integer
        payable_minor:
          type: integer
        paid_minor:
          type: integer
        delivery_fees_minor:
          type: integer
        return_fees_minor:
          type: integer
        extra_attempt_fees_minor:
          type: integer
        collection_fees_minor:
          type: integer
        tax_minor:
          type: integer
        currency:
          type: string
    DriverWallet:
      type: object
      additionalProperties: false
      required:
      - collected_minor
      - remitted_minor
      - outstanding_minor
      - currency
      properties:
        collected_minor:
          type: integer
          minimum: 0
        remitted_minor:
          type: integer
          minimum: 0
        outstanding_minor:
          type: integer
          minimum: 0
